name: Remove obsolete balance UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.author.name != 'genoffice-balance-cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove balance field only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/shell/src/renderer/src/SettingsModal.tsx')
          s = p.read_text()
          old = '''                {loggedIn && (\n                  <Field\n                    label={t('credits')}\n                    value={\n                      status?.creditBalance === undefined\n                        ? '—'\n                        : Math.floor(status.creditBalance).toLocaleString('en-US')\n                    }\n                    action={\n                      <button\n                        className="set-btn"\n                        data-tip={t('creditsTip')}\n                        onClick={() => void window.aiOffice.openCreditUsage?.()}\n                      >\n                        {t('setViewUsage')}\n                      </button>\n                    }\n                  />\n                )}\n'''
          if old not in s:
              raise SystemExit('Expected balance UI block not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "genoffice-balance-cleanup"
          git config user.email "genoffice-balance-cleanup@users.noreply.github.com"
          git add apps/shell/src/renderer/src/SettingsModal.tsx
          git commit -m "fix(settings): remove obsolete balance display"
          git push origin HEAD:main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/remove-balance-ui.yml
          git commit -m "chore(ci): remove temporary balance cleanup workflow"
          git push origin HEAD:main
