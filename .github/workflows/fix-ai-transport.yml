name: Fix AI Transport

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repair transport
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'packages/ai-provider/src/stream.ts'
          let s = fs.readFileSync(path, 'utf8')

          s = s.replace(
            "import { AI_PROVIDERS, NVIDIA_NIM_BASE_URL, OPENROUTER_BASE_URL } from './providers'",
            "import { AI_PROVIDERS, GENSPARK_AGENT_TYPE, GENSPARK_LLM_BASE_URLS, NVIDIA_NIM_BASE_URL, OPENROUTER_BASE_URL } from './providers'\nimport { createStreamWatchdog } from './watchdog'",
          )

          s = s.replace(
            "function parseArgs(raw: string): Record<string, unknown> {\n  if (!raw.trim()) return {}\n  try {\n    return JSON.parse(raw) as Record<string, unknown>\n  } catch {\n    return { _raw: raw }\n  }\n}\n",
            `function repairJsonString(raw: string): string {\n  let out = ''\n  let inString = false\n  let escaped = false\n  for (let i = 0; i < raw.length; i += 1) {\n    const ch = raw[i]\n    if (escaped) { out += ch; escaped = false; continue }\n    if (ch === '\\\\' && inString) { out += ch; escaped = true; continue }\n    if (ch !== '\"') { out += ch; continue }\n    if (!inString) { inString = true; out += ch; continue }\n    let j = i + 1\n    while (j < raw.length && /\\s/.test(raw[j])) j += 1\n    if (['}', ']', ','].includes(raw[j])) { inString = false; out += ch } else out += '\\\\"'\n  }\n  return out\n}\n\nfunction parseToolArgs(raw: string): { input: Record<string, unknown>; inputError?: string } {\n  if (!raw.trim()) return { input: {} }\n  try { return { input: JSON.parse(raw) as Record<string, unknown> } }\n  catch {\n    try { return { input: JSON.parse(repairJsonString(raw)) as Record<string, unknown> } }\n    catch { return { input: {}, inputError: \`Could not parse tool input; raw: \${raw}\` } }\n  }\n}\n\nfunction emitToolCall(cb: StreamCallbacks, call: { id: string; name: string; args: string; truncated?: boolean }): void {\n  const parsed = parseToolArgs(call.args)\n  cb.onToolCall({ id: call.id, name: call.name, input: parsed.input, ...(parsed.inputError ? { inputError: parsed.inputError } : {}), ...(call.truncated ? { truncated: true } : {}) })\n}\n\nfunction responseLooksJson(response: Response): boolean {\n  return (response.headers.get('content-type') ?? '').toLowerCase().includes('application/json')\n}\n\nasync function parseJsonBody(response: Response, label: string): Promise<any> {\n  const text = await response.text()\n  try { return JSON.parse(text) } catch { throw new Error(\`\${label}: \${text || 'empty body'}\`) }\n}\n\nfunction creditsNotice(text: string): boolean {\n  const lower = text.toLowerCase()\n  return lower.includes('credits have been exhausted') || lower.includes('insufficient credits') || lower.includes('out of quota') || (lower.includes('pricing') && (lower.includes('quota') || lower.includes('credit') || lower.includes('top up')))\n}\n`,
          )

          s = s.replace(/parseArgs\(p\.args\)/g, 'parseToolArgs(p.args).input')

          s = s.replace("content: m.text || null,", "content: m.text || (m.toolCalls?.length ? null : ''),")

          const watchdogHelper = `\nasync function withProviderWatchdog<T>(cb: StreamCallbacks, run: (signal: AbortSignal, touch: () => void) => Promise<T>): Promise<T> {\n  const watchdog = createStreamWatchdog(cb.signal)\n  return watchdog.guard(() => run(watchdog.signal, () => { watchdog.touch(); cb.onActivity?.() }))\n}\n`
          s = s.replace("async function streamOpenAiCompatible(", watchdogHelper + "\nasync function streamOpenAiCompatible(")

          s = s.replace(
            "  const response = await fetch(`${baseUrl.replace(/\\/$/, '')}/chat/completions`, {",
            "  return withProviderWatchdog(cb, async (signal, touch) => {\n  const response = await fetch(`${baseUrl.replace(/\\/$/, '')}/chat/completions`,",
            )
          s = s.replace("    method: 'POST',\n    signal: cb.signal,", "    method: 'POST',\n    signal,")
          s = s.replace("  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)", "  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)\n  if (responseLooksJson(response)) return consumeOpenAiJson(await parseJsonBody(response, 'The model returned an unparseable JSON body'), cb)")
          s = s.replace("for await (const line of sseLines(response.body, () => cb.onActivity?.()))", "for await (const line of sseLines(response.body, () => { touch(); cb.onActivity?.() }))")
          s = s.replace("  if (finishReason === 'length') cb.onStopReason?.('max_tokens')\n  else if (finishReason) cb.onStopReason?.(finishReason)\n}", "  if (finishReason === 'length') cb.onStopReason?.('max_tokens')\n  else if (finishReason) cb.onStopReason?.(finishReason)\n  })\n}", 1)

          const openJson = `\nfunction consumeOpenAiJson(body: any, cb: StreamCallbacks): void {\n  const choice = body?.choices?.[0]\n  const message = choice?.message\n  const content = typeof message?.content === 'string' ? message.content : ''\n  if (body?.error?.message) throw creditsNotice(body.error.message) ? new AiCreditsError(body.error.message) : new Error(body.error.message)\n  if (content && creditsNotice(content)) throw new AiCreditsError(content)\n  for (const tc of message?.tool_calls ?? []) { const fn = tc?.function; if (fn?.name) cb.onToolCall({ id: tc.id ?? crypto.randomUUID(), name: fn.name, input: parseToolArgs(fn.arguments ?? '').input }) }\n  if (content) cb.onDelta(content)\n  const reason = choice?.finish_reason\n  if (reason) cb.onStopReason?.(reason === 'length' ? 'max_tokens' : reason)\n  if (!content && !(message?.tool_calls?.length) && !reason) throw new Error(\`The model returned no content: \${JSON.stringify(body)}\`)\n  if (!content && !(message?.tool_calls?.length) && reason && !['stop', 'tool_calls'].includes(reason)) throw new Error(\`The model returned no content (finish_reason=\${reason})\`)\n}\n`
          s = s.replace("function anthropicContents(system: string, messages: AgentMessage[]) {", openJson + "\nfunction anthropicContents(system: string, messages: AgentMessage[]) {")

          s = s.replace(
            "  const response = await fetch('https://api.anthropic.com/v1/messages', {",
            "  return withProviderWatchdog(cb, async (signal, touch) => {\n  const response = await fetch('https://api.anthropic.com/v1/messages',",
          )
          s = s.replace("    signal: cb.signal,", "    signal,")
          s = s.replace("  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`Claude HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)", "  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`Claude HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)\n  if (responseLooksJson(response)) return consumeAnthropicJson(await parseJsonBody(response, 'Claude returned an unparseable JSON body'), cb)")
          s = s.replace("for await (const line of sseLines(response.body, () => cb.onActivity?.()))", "for await (const line of sseLines(response.body, () => { touch(); cb.onActivity?.() }))")
          s = s.replace("  if (stopReason === 'max_tokens') cb.onStopReason?.('max_tokens')\n  else if (stopReason) cb.onStopReason?.(stopReason)\n}", "  if (stopReason === 'max_tokens') cb.onStopReason?.('max_tokens')\n  else if (stopReason) cb.onStopReason?.(stopReason)\n  })\n}", 1)

          const anthropicJson = `\nfunction consumeAnthropicJson(body: any, cb: StreamCallbacks): void {\n  const parts = Array.isArray(body?.content) ? body.content : []\n  const text = parts.filter((p: any) => p?.type === 'text').map((p: any) => p.text).join('')\n  if (body?.error?.message) throw creditsNotice(body.error.message) ? new AiCreditsError(body.error.message) : new Error(body.error.message)\n  if (creditsNotice(text)) throw new AiCreditsError(text)\n  for (const part of parts) if (part?.type === 'tool_use' && part.name) cb.onToolCall({ id: part.id ?? crypto.randomUUID(), name: part.name, input: part.input ?? {} })\n  if (text) cb.onDelta(text)\n  if (body?.stop_reason) cb.onStopReason?.(body.stop_reason)\n  if (!text && !parts.some((p: any) => p?.type === 'tool_use')) throw new Error('Claude returned no content')\n}\n`
          s = s.replace("function geminiContents(messages: AgentMessage[]) {", anthropicJson + "\nfunction geminiContents(messages: AgentMessage[]) {")

          s = s.replace(
            "  const response = await fetch(url, { method: 'POST', signal: cb.signal, headers:",
            "  return withProviderWatchdog(cb, async (signal, touch) => {\n  const response = await fetch(url, { method: 'POST', signal, headers:",
          )
          s = s.replace("  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`Gemini HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)", "  cb.onActivity?.()\n  if (!response.ok || !response.body) throw new Error(`Gemini HTTP ${response.status}: ${httpBodyDetail(await response.text())}`)\n  if (responseLooksJson(response)) return consumeGeminiJson(await parseJsonBody(response, 'Gemini returned an unparseable JSON body'), cb)")
          s = s.replace("for await (const line of sseLines(response.body, () => cb.onActivity?.()))", "for await (const line of sseLines(response.body, () => { touch(); cb.onActivity?.() }))")
          s = s.replace("  if (finishReason === 'MAX_TOKENS') cb.onStopReason?.('max_tokens'); else if (finishReason) cb.onStopReason?.(finishReason.toLowerCase())\n}", "  if (finishReason === 'MAX_TOKENS') cb.onStopReason?.('max_tokens'); else if (finishReason) cb.onStopReason?.(finishReason.toLowerCase())\n  })\n}", 1)

          const geminiJson = `\nfunction consumeGeminiJson(body: any, cb: StreamCallbacks): void {\n  const chunks = Array.isArray(body) ? body : [body]\n  let emitted = false\n  let finishReason\n  for (const chunk of chunks) {\n    if (chunk?.promptFeedback?.blockReason) throw new Error(\`Gemini blocked the prompt (\${chunk.promptFeedback.blockReason})\`)\n    for (const candidate of chunk?.candidates ?? []) {\n      if (candidate.finishReason) finishReason = candidate.finishReason\n      for (const part of candidate.content?.parts ?? []) {\n        if (part.text) { if (creditsNotice(part.text)) throw new AiCreditsError(part.text); cb.onDelta(part.text); emitted = true }\n        if (part.functionCall?.name) { cb.onToolCall({ id: part.functionCall.id ?? crypto.randomUUID(), name: part.functionCall.name, input: part.functionCall.args ?? {} }); emitted = true }\n      }\n    }\n  }\n  if (finishReason) cb.onStopReason?.(finishReason === 'MAX_TOKENS' ? 'max_tokens' : finishReason.toLowerCase())\n  if (!emitted && finishReason && !['STOP', 'END_TURN'].includes(finishReason)) throw new Error(\`Gemini returned no content (finishReason=\${finishReason})\`)\n  if (!emitted && !finishReason) throw new Error(\`Gemini returned no content: \${JSON.stringify(body)}\`)\n}\n`
          s = s.replace("const OPENAI_COMPATIBLE_BASE_URLS:", geminiJson + "\nconst OPENAI_COMPATIBLE_BASE_URLS:")

          const start = s.indexOf('export async function streamForProvider(')
          if (start < 0) throw new Error('streamForProvider not found')
          s = s.slice(0, start) + `export async function streamForProvider(\n  provider: AiProviderId,\n  config: AiProviderConfig,\n  system: string,\n  messages: AgentMessage[],\n  tools: AgentToolDef[],\n  maxTokens: number,\n  cb: StreamCallbacks,\n): Promise<void> {\n  const meta = AI_PROVIDERS.find((item) => item.id === provider)\n  if (!meta) throw new Error(\`Unknown provider: \${provider}\`)\n  const wrappedCb: StreamCallbacks = { ...cb, signal: cb.signal }\n  switch (provider) {\n    case 'custom':\n      if (!config.baseUrl) throw new Error('A custom provider requires a Base URL')\n      return streamOpenAiCompatible(config.baseUrl, config, system, messages, tools, maxTokens, wrappedCb)\n    case 'anthropic':\n      return streamAnthropic(config, system, messages, tools, maxTokens, wrappedCb)\n    case 'gemini':\n      return streamGemini(config, system, messages, tools, maxTokens, wrappedCb)\n    case 'openrouter':\n    case 'nvidia':\n    case 'deepseek':\n    case 'openai': {\n      const baseUrl = { openrouter: 'https://openrouter.ai/api/v1', nvidia: 'https://integrate.api.nvidia.com/v1', deepseek: 'https://api.deepseek.com/v1', openai: 'https://api.openai.com/v1' }[provider]\n      return streamOpenAiCompatible(baseUrl, config, system, messages, tools, maxTokens, wrappedCb)\n    }\n    case 'genspark':\n      if (config.model.startsWith('claude-')) return streamAnthropic(config, system, messages, tools, maxTokens, wrappedCb, GENSPARK_LLM_BASE_URLS.anthropic, { 'X-Agent-Type': GENSPARK_AGENT_TYPE })\n      if (config.model.startsWith('gemini-')) return streamGemini(config, system, messages, tools, maxTokens, wrappedCb, GENSPARK_LLM_BASE_URLS.gemini, { 'X-Agent-Type': GENSPARK_AGENT_TYPE })\n      return streamOpenAiCompatible(GENSPARK_LLM_BASE_URLS.openai, config, system, messages, tools, maxTokens, wrappedCb, { 'X-Agent-Type': GENSPARK_AGENT_TYPE })\n    default:\n      throw new Error(\`Unknown provider: \${provider}\`)\n  }\n}\n`\n
          fs.writeFileSync(path, s)
          NODE
          npx prettier --write packages/ai-provider/src/stream.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-provider/src/stream.ts
          git commit -m 'fix(ai): restore audited streaming behavior [ai-transport-repair]'
          git push
