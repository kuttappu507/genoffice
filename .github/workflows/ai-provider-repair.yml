name: Temporary AI provider repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair provider routing and retries
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Excel standalone had a legacy hard reset that ignored the selected provider.
          p = Path('apps/sheets/src/main/sheets-main.ts')
          s = p.read_text()
          old = "    // AI features all go through Genspark (gsk login); legacy settings that chose\n    // another provider are reset\n    settings.provider = 'genspark'\n"
          if old not in s:
              raise SystemExit('Expected Sheets provider reset block was not found')
          s = s.replace(old, "    // Preserve the provider selected in AI Settings. Genspark remains available only when explicitly selected.\n", 1)
          p.write_text(s)

          # NVIDIA/OpenAI-compatible 429s are transient rate limits. Retry only the request,
          # never by falling back to Genspark or submitting a second user turn.
          p = Path('packages/ai-provider/src/robust-stream.ts')
          s = p.read_text()
          old = "async function openAi(\n"
          if old not in s:
              raise SystemExit('openAi function not found')
          helper = '''async function fetchOpenAiWithRateLimitRetry(\n  url: string,\n  init: RequestInit,\n  signal: AbortSignal,\n): Promise<Response> {\n  const maxAttempts = 3\n  for (let attempt = 0; attempt < maxAttempts; attempt += 1) {\n    const response = await fetch(url, init)\n    if (response.status !== 429 || attempt === maxAttempts - 1) return response\n\n    const retryAfter = Number(response.headers.get('retry-after') ?? '')\n    const delayMs = Number.isFinite(retryAfter) && retryAfter > 0\n      ? Math.min(10_000, retryAfter * 1000)\n      : Math.min(4_000, 500 * 2 ** attempt)\n    await new Promise<void>((resolve, reject) => {\n      const timer = setTimeout(resolve, delayMs)\n      const onAbort = () => {\n        clearTimeout(timer)\n        reject(new DOMException('The request was aborted', 'AbortError'))\n      }\n      if (signal.aborted) {\n        onAbort()\n        return\n      }\n      signal.addEventListener('abort', onAbort, { once: true })\n    })\n  }\n  throw new Error('Unreachable')\n}\n\n'''
          s = s.replace(old, helper + old, 1)
          old_fetch = "    const response = await fetch(`${baseUrl.replace(/\\/$/, '')}/chat/completions`, {"
          if old_fetch not in s:
              raise SystemExit('OpenAI-compatible fetch call not found')
          s = s.replace(old_fetch, "    const response = await fetchOpenAiWithRateLimitRetry(\n      `${baseUrl.replace(/\\/$/, '')}/chat/completions`,\n      {", 1)
          # The original fetch call closes with `})`; add the helper's third argument.
          marker = "      }),\n    })\n    cb.onActivity?.()\n    if (!response.ok) {"
          if marker not in s:
              raise SystemExit('OpenAI-compatible request closing marker not found')
          s = s.replace(marker, "      }),\n      signal,\n    )\n    cb.onActivity?.()\n    if (!response.ok) {", 1)
          p.write_text(s)

          # Gemini tool schema: recursively normalize every schema node and make sure
          # tuple-style JSON Schema `items` arrays never reach the protobuf REST parser.
          p = Path('packages/ai-provider/src/gemini-schema.ts')
          s = p.read_text()
          old = """  if (schema.items) {\n    const item = Array.isArray(schema.items) ? schema.items[0] : schema.items\n    if (item) result.items = toGeminiSchema(item)\n  }\n"""
          new = """  if (schema.items) {\n    const item = Array.isArray(schema.items) ? schema.items[0] : schema.items\n    if (item && typeof item === 'object') result.items = toGeminiSchema(item)\n  }\n\n  // Gemini function-declaration schemas are stricter than general JSON Schema.\n  // Never allow a schema node without a concrete type to masquerade as an array/object.\n  if (result.type === 'ARRAY' && !result.items) {\n    result.items = { type: 'STRING' }\n  }\n  if (result.type === 'OBJECT' && !result.properties) {\n    result.properties = {}\n  }\n"""
          if old not in s:
              raise SystemExit('Gemini items block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Remove this one-shot workflow before committing so no audit/repair machinery remains.
          Path('.github/workflows/ai-provider-repair.yml').unlink()
          PY
      - name: Format changed TypeScript files
        run: npx prettier --write apps/sheets/src/main/sheets-main.ts packages/ai-provider/src/robust-stream.ts packages/ai-provider/src/gemini-schema.ts
      - name: Commit repaired source
        run: |
          git config user.name "genoffice-ai-repair"
          git config user.email "genoffice-ai-repair@users.noreply.github.com"
          git add apps/sheets/src/main/sheets-main.ts packages/ai-provider/src/robust-stream.ts packages/ai-provider/src/gemini-schema.ts .github/workflows/ai-provider-repair.yml
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m "fix(ai): restore direct providers and harden rate/schema handling"
          git push origin HEAD:main
