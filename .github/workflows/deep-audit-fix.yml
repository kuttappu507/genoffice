name: Deep audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-audit-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[deep-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Remove legacy provider override and normalize audit fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const docs = 'apps/docs/src/main/docs-main.ts'
          let docsText = fs.readFileSync(docs, 'utf8')
          const docsOld = "    // AI features all go through Genspark (gsk login); legacy settings with another provider are reset\n    settings.provider = 'genspark'\n"
          if (!docsText.includes(docsOld)) throw new Error('Docs legacy provider override anchor not found')
          docsText = docsText.replace(docsOld, '')
          fs.writeFileSync(docs, docsText)

          const providers = 'packages/ai-provider/src/providers.ts'
          let providerText = fs.readFileSync(providers, 'utf8')
          const start = providerText.indexOf('  let activeProvider:')
          const end = providerText.lastIndexOf('\n}')
          if (start < 0 || end <= start) throw new Error('Provider compatibility fence anchor not found')
          providerText = providerText.slice(0, start) + "  return {\n    provider: migratedProvider === 'genspark' ? defaults.provider : migratedProvider,\n    providers,\n  }\n" + providerText.slice(end + 1)
          fs.writeFileSync(providers, providerText)

          const secure = 'packages/ai-provider/src/electron-secure-ipc.ts'
          let secureText = fs.readFileSync(secure, 'utf8')
          const oldSecure = "    if (typeof process === 'undefined' || process.type !== 'browser') return null\n"
          const newSecure = "    if (typeof process === 'undefined' || (process as NodeJS.Process & { type?: string }).type !== 'browser') return null\n"
          if (!secureText.includes(oldSecure)) throw new Error('secure IPC process guard anchor not found')
          secureText = secureText.replace(oldSecure, newSecure)
          fs.writeFileSync(secure, secureText)
          NODE
      - name: Format changed sources
        run: npx prettier --write apps/docs/src/main/docs-main.ts packages/ai-provider/src/providers.ts packages/ai-provider/src/electron-secure-ipc.ts apps/slides/src/main/ai-ipc.ts
      - name: Verify focused lint
        run: npx eslint apps/docs/src/main/docs-main.ts packages/ai-provider/src/providers.ts packages/ai-provider/src/electron-secure-ipc.ts apps/slides/src/main/ai-ipc.ts apps/android/src/pdf-android-platform.ts
      - name: Verify typecheck
        run: npm run typecheck
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/docs/src/main/docs-main.ts packages/ai-provider/src/providers.ts packages/ai-provider/src/electron-secure-ipc.ts apps/slides/src/main/ai-ipc.ts
          git commit -m 'fix(ai): remove legacy override and fix secure IPC typing [deep-audit]'
          git push
