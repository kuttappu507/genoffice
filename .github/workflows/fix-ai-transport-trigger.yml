name: Run AI Transport Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-transport.yml'
      - '.github/workflows/fix-ai-transport-trigger.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute embedded repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const cp = require('node:child_process')
          const yaml = fs.readFileSync('.github/workflows/fix-ai-transport.yml', 'utf8')
          const start = yaml.indexOf("node <<'NODE'")
          const end = yaml.indexOf('\n          NODE', start)
          if (start < 0 || end < 0) throw new Error('embedded repair script not found')
          const raw = yaml.slice(start + "node <<'NODE'".length, end)
          const script = raw.split('\n').map((line) => line.startsWith('          ') ? line.slice(10) : line).join('\n')
          fs.writeFileSync('.github/ai-transport-repair.cjs', script)
          const result = cp.spawnSync(process.execPath, ['.github/ai-transport-repair.cjs'], { stdio: 'inherit' })
          if (result.status !== 0) process.exit(result.status ?? 1)
          NODE
      - name: Run focused checks
        run: |
          npx prettier --write packages/ai-provider/src/stream.ts
          npx eslint packages/ai-provider/src/stream.ts
          npx tsc --noEmit -p packages/ai-provider/tsconfig.json
      - name: Commit repair
        run: |
          rm -f .github/ai-transport-repair.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-provider/src/stream.ts
          git commit -m 'fix(ai): restore audited streaming behavior [ai-transport-repair]' || exit 0
          git push
