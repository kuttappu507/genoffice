name: AI provider repair trigger

on:
  push:
    paths:
      - .github/workflows/ai-provider-repair-trigger.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused provider fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('apps/sheets/src/main/sheets-main.ts')
          s = p.read_text()
          old = "    // AI features all go through Genspark (gsk login); legacy settings that chose\n    // another provider are reset\n    settings.provider = 'genspark'\n"
          if old not in s:
              raise SystemExit('Sheets legacy provider reset not found')
          p.write_text(s.replace(old, "    // Preserve the provider selected in AI Settings. Genspark is used only when explicitly selected.\n", 1))

          p = Path('packages/ai-provider/src/robust-stream.ts')
          s = p.read_text()
          helper = '''async function fetchOpenAiWithRateLimitRetry(url: string, init: RequestInit, signal: AbortSignal): Promise<Response> {\n  const maxAttempts = 3\n  for (let attempt = 0; attempt < maxAttempts; attempt += 1) {\n    const response = await fetch(url, init)\n    if (response.status !== 429 || attempt === maxAttempts - 1) return response\n    const retryAfter = Number(response.headers.get('retry-after') ?? '')\n    const delayMs = Number.isFinite(retryAfter) && retryAfter > 0 ? Math.min(10_000, retryAfter * 1000) : Math.min(4_000, 500 * 2 ** attempt)\n    await new Promise<void>((resolve, reject) => {\n      const timer = setTimeout(resolve, delayMs)\n      const onAbort = () => { clearTimeout(timer); reject(new DOMException('The request was aborted', 'AbortError')) }\n      if (signal.aborted) { onAbort(); return }\n      signal.addEventListener('abort', onAbort, { once: true })\n    })\n  }\n  throw new Error('Unreachable')\n}\n\n'''
          if 'fetchOpenAiWithRateLimitRetry' not in s:
              s = s.replace('async function openAi(\n', helper + 'async function openAi(\n', 1)
          old = "    const response = await fetch(`${baseUrl.replace(/\\/$/, '')}/chat/completions`, {"
          new = "    const response = await fetchOpenAiWithRateLimitRetry(\n      `${baseUrl.replace(/\\/$/, '')}/chat/completions`,\n      {"
          if old in s:
              s = s.replace(old, new, 1)
              marker = "      }),\n    })\n    cb.onActivity?.()\n    if (!response.ok) {"
              if marker not in s: raise SystemExit('OpenAI request close marker not found')
              s = s.replace(marker, "      }),\n      signal,\n    )\n    cb.onActivity?.()\n    if (!response.ok) {", 1)
          p.write_text(s)

          p = Path('packages/ai-provider/src/gemini-schema.ts')
          s = p.read_text()
          old = "  if (schema.items) {\n    const item = Array.isArray(schema.items) ? schema.items[0] : schema.items\n    if (item) result.items = toGeminiSchema(item)\n  }\n"
          if old in s:
              new = "  if (schema.items) {\n    const item = Array.isArray(schema.items) ? schema.items[0] : schema.items\n    if (item && typeof item === 'object') result.items = toGeminiSchema(item)\n  }\n\n  if (result.type === 'ARRAY' && !result.items) result.items = { type: 'STRING' }\n"
              s = s.replace(old, new, 1)
          p.write_text(s)

          Path('.github/workflows/ai-provider-repair.yml').unlink(missing_ok=True)
          Path('.github/workflows/ai-provider-repair-trigger.yml').unlink(missing_ok=True)
          PY
      - name: Format and commit
        run: |
          npx prettier --write apps/sheets/src/main/sheets-main.ts packages/ai-provider/src/robust-stream.ts packages/ai-provider/src/gemini-schema.ts
          git config user.name "genoffice-ai-repair"
          git config user.email "genoffice-ai-repair@users.noreply.github.com"
          git add apps/sheets/src/main/sheets-main.ts packages/ai-provider/src/robust-stream.ts packages/ai-provider/src/gemini-schema.ts .github/workflows/ai-provider-repair.yml .github/workflows/ai-provider-repair-trigger.yml
          git diff --cached --quiet || git commit -m "fix(ai): restore direct providers and harden provider requests"
          git push origin HEAD:main
