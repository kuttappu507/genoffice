name: Format AI provider registry

on:
  push:
    branches: [main]
    paths:
      - 'packages/ai-provider/src/providers.ts'
      - '.github/workflows/format-ai-provider.yml'

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat-ai-provider]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format provider registry
        run: npx prettier --write packages/ai-provider/src/providers.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- packages/ai-provider/src/providers.ts; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-provider/src/providers.ts
          git commit -m 'style(ai): canonicalize provider registry [autoformat-ai-provider]'
          git push
